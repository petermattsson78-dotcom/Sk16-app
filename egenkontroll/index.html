<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Egenkontroll</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Egenkontroll">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:#060e1a;color:#cbd5e1;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:100vh;
       padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
       -webkit-tap-highlight-color:transparent}
  input,select,textarea{font-family:inherit;font-size:16px !important}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:#0c1a2e}
  ::-webkit-scrollbar-thumb{background:#1a3050;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<noscript>Appen kräver JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
